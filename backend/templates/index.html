<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterOne - Agricultural Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            return (
                <div class="max-w-4xl mx-auto p-6 text-center">
                    <h1 class="text-3xl font-bold text-green-700 mb-4">
                        🌾 Welcome to InterOne Marketplace
                    </h1>
                    <p class="text-gray-600 text-lg mb-6">
                        FastAPI backend and React frontend are now connected successfully!
                    </p>
                    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                        <h2 class="text-xl font-semibold mb-2">System Status</h2>
                        <span class="inline-block px-4 py-1 bg-green-100 text-green-800 rounded-full font-medium text-sm">
                            Live on Render
                        </span>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
