<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterOne - Agricultural Marketplace & AI Advisory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('marketplace');
            const [listings, setListings] = useState([]);
            const [loadingListings, setLoadingListings] = useState(false);

            const [newListing, setNewListing] = useState({
                farmer_name: '', crop_name: '', quantity_kg: '', price_per_kg: '', location: '', contact: ''
            });

            const [chatMsg, setChatMsg] = useState('');
            const [chatReply, setChatReply] = useState('');
            const [chatLoading, setChatLoading] = useState(false);

            const [zeroForm, setZeroForm] = useState({ crop_name: '', quantity_kg: '', location: '', condition: 'Fresh Surplus' });
            const [zeroReply, setZeroReply] = useState('');
            const [zeroLoading, setZeroLoading] = useState(false);

            const [mandiForm, setMandiForm] = useState({ crop_name: '', location: '' });
            const [mandiReply, setMandiReply] = useState('');
            const [mandiLoading, setMandiLoading] = useState(false);

            useEffect(() => {
                fetchListings();
            }, []);

            const fetchListings = async () => {
                setLoadingListings(true);
                try {
                    const res = await fetch('/api/listings');
                    const data = await res.json();
                    setListings(Array.isArray(data) ? data : []);
                } catch (err) {
                    console.error("Error fetching listings:", err);
                } finally {
                    setLoadingListings(false);
                }
            };

            const handleCreateListing = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/listings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            ...newListing,
                            quantity_kg: parseFloat(newListing.quantity_kg),
                            price_per_kg: parseFloat(newListing.price_per_kg)
                        })
                    });
                    if (res.ok) {
                        setNewListing({ farmer_name: '', crop_name: '', quantity_kg: '', price_per_kg: '', location: '', contact: '' });
                        fetchListings();
                        alert('Listing created successfully!');
                    }
                } catch (err) {
                    alert('Failed to post listing');
                }
            };

            const handleAiChat = async () => {
                if (!chatMsg) return;
                setChatLoading(true);
                try {
                    const res = await fetch('/api/ai/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: chatMsg })
                    });
                    const data = await res.json();
                    setChatReply(data.reply);
                } catch (err) {
                    setChatReply('Error communicating with AI');
                } finally {
                    setChatLoading(false);
                }
            };

            const handleZeroWaste = async () => {
                setZeroLoading(true);
                try {
                    const res = await fetch('/api/ai/zero-waste', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            ...zeroForm,
                            quantity_kg: parseFloat(zeroForm.quantity_kg)
                        })
                    });
                    const data = await res.json();
                    setZeroReply(data.strategy);
                } catch (err) {
                    setZeroReply('Error generating zero-waste strategy');
                } finally {
                    setZeroLoading(false);
                }
            };

            const handleMandiIntel = async () => {
                setMandiLoading(true);
                try {
                    const res = await fetch('/api/ai/mandi-price', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(mandiForm)
                    });
                    const data = await res.json();
                    setMandiReply(data.report);
                } catch (err) {
                    setMandiReply('Error fetching Mandi report');
                } finally {
                    setMandiLoading(false);
                }
            };

            return (
                <div className="max-w-6xl mx-auto px-4 py-8">
                    <header className="bg-emerald-700 text-white p-6 rounded-2xl shadow-lg mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 className="text-3xl font-bold tracking-tight">🌾 InterOne</h1>
                            <p className="text-emerald-100 text-sm">Direct Agricultural Marketplace & AI Advisory</p>
                        </div>
                        <nav className="flex gap-2 bg-emerald-800 p-1.5 rounded-xl text-sm font-medium">
                            {['marketplace', 'chat', 'zero-waste', 'mandi-price'].map(tab => (
                                <button
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`px-4 py-2 rounded-lg capitalize transition ${
                                        activeTab === tab ? 'bg-white text-emerald-800 shadow' : 'text-emerald-100 hover:text-white'
                                    }`}
                                >
                                    {tab.replace('-', ' ')}
                                </button>
                            ))}
                        </nav>
                    </header>

                    {activeTab === 'marketplace' && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-xl font-bold mb-4 text-emerald-800">Post New Crop Listing</h2>
                                <form onSubmit={handleCreateListing} className="space-y-4">
                                    <input type="text" placeholder="Farmer Name" required className="w-full p-2.5 border rounded-lg" value={newListing.farmer_name} onChange={e => setNewListing({...newListing, farmer_name: e.target.value})} />
                                    <input type="text" placeholder="Crop Name (e.g., Rice, Tomatoes)" required className="w-full p-2.5 border rounded-lg" value={newListing.crop_name} onChange={e => setNewListing({...newListing, crop_name: e.target.value})} />
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="number" step="any" placeholder="Quantity (kg)" required className="w-full p-2.5 border rounded-lg" value={newListing.quantity_kg} onChange={e => setNewListing({...newListing, quantity_kg: e.target.value})} />
                                        <input type="number" step="any" placeholder="Price (₹/kg)" required className="w-full p-2.5 border rounded-lg" value={newListing.price_per_kg} onChange={e => setNewListing({...newListing, price_per_kg: e.target.value})} />
                                    </div>
                                    <input type="text" placeholder="Location (District/State)" required className="w-full p-2.5 border rounded-lg" value={newListing.location} onChange={e => setNewListing({...newListing, location: e.target.value})} />
                                    <input type="text" placeholder="Contact Phone / WhatsApp" required className="w-full p-2.5 border rounded-lg" value={newListing.contact} onChange={e => setNewListing({...newListing, contact: e.target.value})} />
                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow transition">
                                        Submit Listing
                                    </button>
                                </form>
                            </div>

                            <div className="lg:col-span-2">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-slate-800">Available Produce</h2>
                                    <button onClick={fetchListings} className="text-sm text-emerald-600 hover:underline">Refresh List</button>
                                </div>
                                {loadingListings ? (
                                    <p className="text-slate-500">Loading marketplace items...</p>
                                ) : listings.length === 0 ? (
                                    <div className="bg-white p-8 rounded-2xl text-center text-slate-500 border">No listings available yet. Be the first to post!</div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {listings.map(item => (
                                            <div key={item.id} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow transition">
                                                <div className="flex justify-between items-start mb-2">
                                                    <h3 className="text-lg font-bold text-slate-900">{item.crop_name}</h3>
                                                    <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">₹{item.price_per_kg}/kg</span>
                                                </div>
                                                <p className="text-slate-600 text-sm mb-1">📦 Quantity: <span className="font-semibold">{item.quantity_kg} kg</span></p>
                                                <p className="text-slate-600 text-sm mb-1">📍 Location: {item.location}</p>
                                                <p className="text-slate-600 text-sm mb-3">🧑‍🌾 Farmer: {item.farmer_name}</p>
                                                <a href={`tel:${item.contact}`} className="inline-block text-center w-full bg-slate-100 hover:bg-slate-200 text-slate-800 text-sm font-medium py-2 rounded-lg border">
                                                    📞 Contact Seller
                                                </a>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {activeTab === 'chat' && (
                        <div className="max-w-3xl mx-auto bg-white p-6 rounded-2xl border shadow-sm">
                            <h2 className="text-xl font-bold mb-4 text-emerald-800">InterOne AI Assistant</h2>
                            <textarea rows="4" placeholder="Ask anything about crop selection, selling advice, or market trends..." className="w-full p-3 border rounded-xl mb-4" value={chatMsg} onChange={e => setChatMsg(e.target.value)}></textarea>
                            <button onClick={handleAiChat} disabled={chatLoading} className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow">
                                {chatLoading ? 'Thinking...' : 'Ask AI'}
                            </button>
                            {chatReply && (
                                <div
                                    className="mt-6 p-6 bg-slate-50 border rounded-xl text-slate-700 prose max-w-none space-y-2"
                                    dangerouslySetInnerHTML={{ __html: marked.parse(chatReply) }}
                                />
                            )}
                        </div>
                    )}

                    {activeTab === 'zero-waste' && (
                        <div className="max-w-3xl mx-auto bg-white p-6 rounded-2xl border shadow-sm">
                            <h2 className="text-xl font-bold mb-4 text-emerald-800">Zero-Waste Advisory</h2>
                            <div className="grid grid-cols-2 gap-4 mb-4">
                                <input type="text" placeholder="Crop Name" className="p-2.5 border rounded-lg" value={zeroForm.crop_name} onChange={e => setZeroForm({...zeroForm, crop_name: e.target.value})} />
                                <input type="number" placeholder="Quantity (kg)" className="p-2.5 border rounded-lg" value={zeroForm.quantity_kg} onChange={e => setZeroForm({...zeroForm, quantity_kg: e.target.value})} />
                                <input type="text" placeholder="Location" className="p-2.5 border rounded-lg" value={zeroForm.location} onChange={e => setZeroForm({...zeroForm, location: e.target.value})} />
                                <select className="p-2.5 border rounded-lg" value={zeroForm.condition} onChange={e => setZeroForm({...zeroForm, condition: e.target.value})}>
                                    <option value="Fresh Surplus">Fresh Surplus</option>
                                    <option value="Slightly Damaged">Slightly Damaged</option>
                                    <option value="Overripe">Overripe</option>
                                </select>
                            </div>
                            <button onClick={handleZeroWaste} disabled={zeroLoading} className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow">
                                {zeroLoading ? 'Analyzing...' : 'Generate Strategy'}
                            </button>
                            {zeroReply && (
                                <div className="mt-6 p-4 bg-slate-50 border rounded-xl whitespace-pre-line text-slate-700">
                                    {zeroReply}
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'mandi-price' && (
                        <div className="max-w-3xl mx-auto bg-white p-6 rounded-2xl border shadow-sm">
                            <h2 className="text-xl font-bold mb-4 text-emerald-800">Mandi Price Intelligence</h2>
                            <div className="grid grid-cols-2 gap-4 mb-4">
                                <input type="text" placeholder="Crop Name (e.g. Onion)" className="p-2.5 border rounded-lg" value={mandiForm.crop_name} onChange={e => setMandiForm({...mandiForm, crop_name: e.target.value})} />
                                <input type="text" placeholder="Mandi / District (e.g. Madurai)" className="p-2.5 border rounded-lg" value={mandiForm.location} onChange={e => setMandiForm({...mandiForm, location: e.target.value})} />
                            </div>
                            <button onClick={handleMandiIntel} disabled={mandiLoading} className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow">
                                {mandiLoading ? 'Fetching Prices...' : 'Get Intelligence Report'}
                            </button>
                            {mandiReply && (
                                <div className="mt-6 p-4 bg-slate-50 border rounded-xl whitespace-pre-line text-slate-700">
                                    {mandiReply}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
